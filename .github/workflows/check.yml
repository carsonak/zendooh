name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up user-space tools
        shell: bash
        run: |
          # Hosted runners supply another SDK; exercise the project-managed SDK.
          unset ANDROID_HOME ANDROID_SDK_ROOT
          bash scripts/setup.sh --accept-licenses
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify setup regressions
        run: mise run test:setup
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        if: runner.os == 'Linux'
      - name: Verify project
        if: runner.os == 'Linux'
        run: xvfb-run -a mise run check

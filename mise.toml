min_version = "2026.10.18"

[plugins]
"vfox:android-sdk" = "https://github.com/jdx/vfox-android-sdk.git#2e4abbe0db0c862d518f7eacb120cb5db597dbfa"

[vars]
android_build_tools = "36.0.0"

[env]
ZENDOOH_ANDROID_PACKAGES = "platform-tools platforms;android-36 build-tools;35.0.0 build-tools;{{ vars.android_build_tools }}"
_.path = { path = [
  "{{ tools['android-sdk'].path }}/platform-tools",
  "{{ tools['android-sdk'].path }}/build-tools/{{ vars.android_build_tools }}",
], tools = true }

[tools]
"vfox:android-sdk" = { version = "19.0", build_tools = false }
java = "temurin-21.0.9+10.0.LTS"
node = "24.20.0"
prettier = "3.9.6"
"npm:markdownlint-cli" = "0.50.0"
shfmt = "3.13.1"
shellcheck = "0.11.0"
taplo = "0.10.0"
actionlint = "1.7.12"

[tasks."format:docs"]
run = "bash scripts/quality.sh prettier write"

[tasks."format:shell"]
run = "bash scripts/quality.sh shell write"

[tasks."format:toml"]
run = "bash scripts/quality.sh toml write"

[tasks."format:kotlin"]
run = "./gradlew ktlintFormat"

[tasks.format]
depends = ["format:docs", "format:shell", "format:toml", "format:kotlin"]

[tasks."format:check:docs"]
run = "bash scripts/quality.sh prettier check"

[tasks."format:check:shell"]
run = "bash scripts/quality.sh shell check"

[tasks."format:check:toml"]
run = "bash scripts/quality.sh toml check"

[tasks."format:check:kotlin"]
run = "./gradlew ktlintCheck"

[tasks."format:check"]
depends = [
  "format:check:docs",
  "format:check:shell",
  "format:check:toml",
  "format:check:kotlin",
]

[tasks."lint:markdown"]
run = "bash scripts/quality.sh markdown check"

[tasks."lint:shell"]
run = "bash scripts/quality.sh shellcheck check"

[tasks."lint:workflows"]
run = "bash scripts/quality.sh workflows check"

[tasks."lint:kotlin"]
run = "./gradlew detekt"

[tasks."lint:android"]
run = "./gradlew :androidApp:lintDebug"

[tasks.lint]
run = [
  "mise run lint:markdown",
  "mise run lint:shell",
  "mise run lint:workflows",
  "./gradlew detekt :androidApp:lintDebug",
]

[tasks.test]
run = ["python3 -B scripts/test_setup.py", "./gradlew :composeApp:desktopTest"]

[tasks.build]
run = "./gradlew :androidApp:assembleDebug :composeApp:desktopJar"

[tasks.check]
# Sequence aggregate stages to avoid competing Gradle invocations in CI.
run = ["mise run format:check", "mise run lint", "mise run test", "mise run build"]

[tasks."run:desktop"]
run = "./gradlew :composeApp:run"

[tasks.setup]
description = "Install the user-space development environment"
run = "bash scripts/setup.sh"

[tasks."test:setup"]
description = "Run isolated development setup regression tests"
run = "python3 -B scripts/test_setup.py"
